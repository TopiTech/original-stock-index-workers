<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="独自株価指数のリアルタイム追跡と日経225とのパフォーマンス比較" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <title>Original Index Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // アセット読み込みエラー（Cloudflare 500 / ネットワーク障害 / デプロイスキュー）対策
      window.addEventListener('error', function(event) {
        var target = event.target || event.srcElement;
        var isScriptOrLink = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        if (isScriptOrLink) {
          var retryKey = 'asset_reload_retry_' + window.location.pathname;
          var hasRetried = sessionStorage.getItem(retryKey);
          if (!hasRetried) {
            sessionStorage.setItem(retryKey, 'true');
            // キャッシュをバイパスして1回自動再読み込み
            setTimeout(function() {
              window.location.reload();
            }, 1000);
            return;
          }
          // 2回目以降もロードできない場合はフォールバックUIを表示
          var root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            root.innerHTML = [
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:20px;text-align:center;">',
              '  <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:32px;max-width:480px;box-shadow:0 10px 25px rgba(0,0,0,0.5);">',
              '    <div style="font-size:40px;margin-bottom:16px;">⚠️</div>',
              '    <h2 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#38bdf8;">リソースの読み込みに失敗しました</h2>',
              '    <p style="margin:0 0 20px;font-size:14px;color:#94a3b8;line-height:1.6;">Cloudflareエッジまたはネットワークの一時的なエラーにより、最新のアプリケーションスクリプトが取得できませんでした。</p>',
              '    <button onclick="sessionStorage.removeItem(\'' + retryKey + '\');window.location.reload(true);" style="background:#0284c7;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;">再読み込み</button>',
              '  </div>',
              '</div>'
            ].join('');
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
